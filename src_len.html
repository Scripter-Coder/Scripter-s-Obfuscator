<!DOCTYPE html><html><head><meta charset="utf-8"><title>src_len</title></head><body><pre id="out"></pre>
<script src="https://cdn.jsdelivr.net/npm/luaparse@0.3.1/luaparse.min.js"></script>
<script type="module">
import { vmBCSetLuaparse, applyBytecodeVm } from './vm-bytecode.js';
const luaparse = window.luaparse;
vmBCSetLuaparse(luaparse);
let src='RESULT="ok"';
let vm=applyBytecodeVm(src,{profile:'BALANCED', seedOverride:0});
let m = vm.match(/local src=\{([^}]+)\}/);
let len = m ? m[1].split(',').filter(s=>s.trim()!=='').length : 0;
let blName = vm.match(/local (b\w+)=\{\}/);
let bl = blName ? blName[1] : 'none';
let uses = (vm.match(new RegExp(bl+"\\[rp\\]", "g"))||[]).length;
document.getElementById('out').textContent = "src len "+len+" blName "+bl+" uses "+uses+"\n"+vm.slice(vm.indexOf("local "+bl), vm.indexOf("local "+bl)+500);
console.log("src len",len,"bl",bl);
</script></body></html>
