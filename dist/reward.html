<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reward</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 30px 16px; }
        .wrap { width: 100%; max-width: 720px; }
        .card { background: rgba(20,20,35,0.8); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 26px; margin-bottom: 18px; }
        h1 { font-size: 24px; }
        h2 { font-size: 17px; }
        .sub { color: #8888aa; font-size: 13px; margin-top: 6px; line-height: 1.6; }
        .progress-row { display: flex; align-items: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
        .progress-bar { flex: 1; height: 12px; min-width: 140px; background: rgba(255,255,255,0.07); border-radius: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #66ff66, #00cc44); border-radius: 8px; transition: width .6s; }
        .progress-label { color: #8888aa; font-size: 13px; white-space: nowrap; }
        .btn { border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-family: inherit; transition: all .2s; }
        .btn-primary { color: #fff; background: linear-gradient(135deg, #6c3bff, #00bfff); }
        .btn-primary:hover { filter: brightness(1.15); }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; background: rgba(108,59,255,0.25); color: #a78bfa; border: 1px solid rgba(108,59,255,0.35); cursor: pointer; }
        .btn-sm:hover { background: rgba(108,59,255,0.5); color: #fff; }
        .btn-sm:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-start { padding: 12px 30px; font-size: 15px; }
        .btn-start.done { background: transparent; border: 2px solid #66ff66; color: #66ff66; }
        .btn-key { width: 100%; padding: 14px; font-size: 15px; color: #fff; background: linear-gradient(135deg, #6c3bff, #00bfff); margin-top: 16px; }
        .btn-key:disabled { opacity: 0.35; cursor: not-allowed; background: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        th { text-align: left; color: #8888aa; font-size: 11px; text-transform: uppercase; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        td { padding: 10px 8px; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .keymono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #66ccff; word-break: break-all; }
        /* The copy button next to a key. A key is 192 characters and it wraps
           over several lines, so selecting it by hand is a hunt for the end of
           the string. One click is the whole difference between "copy and
           paste" and "where does it stop". */
        .keycopy { border: 1px solid rgba(108,59,255,0.35); background: rgba(108,59,255,0.18); color: #a78bff; border-radius: 7px; cursor: pointer; font-size: 11px; padding: 3px 7px; margin-left: 6px; vertical-align: middle; font-family: inherit; line-height: 1.3; transition: all .2s; }
        .keycopy:hover { background: rgba(108,59,255,0.45); color: #fff; }
        .keycopy.copied { background: rgba(0,204,68,0.35); border-color: rgba(0,204,68,0.5); color: #66ff66; }
        .keycopy.failed { background: rgba(255,107,107,0.3); border-color: rgba(255,107,107,0.5); color: #ff6b6b; }
        .status-active { color: #66ff66; } .status-expired { color: #ff6b6b; }
        .notif { position: fixed; top: 20px; right: 20px; left: 20px; background: linear-gradient(135deg, #0ca84c, #66ff66); color: #fff; padding: 14px 20px; border-radius: 12px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,0.5); opacity: 0; transform: translateY(-20px); transition: all .35s; z-index: 100; text-align: center; }
        .notif.show { opacity: 1; transform: translateY(0); }
        .cooldown-note { color: #ffd700; font-size: 13px; margin-top: 12px; text-align: center; }
        .err { text-align: center; color: #ff4444; font-size: 20px; font-weight: 700; padding: 60px 0; }
        .steps { margin-top: 14px; }
        .step { display: flex; align-items: center; gap: 10px; font-size: 13px; padding: 7px 0; color: #8888aa; }
        .step .n { width: 22px; height: 22px; flex: 0 0 22px; border-radius: 50%; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; font-size: 11px; }
        .step.done { color: #66ff66; } .step.done .n { background: rgba(0,204,68,0.25); }
        .step.now { color: #fff; font-weight: 600; } .step.now .n { background: linear-gradient(135deg,#6c3bff,#00bfff); color: #fff; }
        .warn { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: rgba(255,180,0,0.1); border: 1px solid rgba(255,180,0,0.3); color: #ffd700; font-size: 12px; line-height: 1.6; }
        .big { font-size: 52px; text-align: center; line-height: 1; }
        .center { text-align: center; }
        code { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: #66ccff; }
    </style>
</head>
<body>
    <script data-sh-endpoint="https://scripterhub-stats.dubovikstanislav51.workers.dev"></script>
    <div class="notif" id="notif">Done</div>
    <div class="wrap" id="app"><div class="err">Loading reward...</div></div>
<script>
(function () {
    'use strict';

    // ---------------------------------------------------------------- worker --
    // The reward config, the visitor's progress and the keys they earn all live
    // on the worker. This page holds none of it.
    //
    // It used to: the whole config rode in the URL as base64, progress rode in
    // localStorage, and the key was generated here with Math.random(). Every
    // one of those was editable by the visitor, so the reward paid out on
    // demand - rewrite the config to a single about:blank checkpoint, append
    // ?done=0, and a key appeared.
    var W = (function () {
        var s = document.querySelector('script[data-sh-endpoint]');
        if (s && s.getAttribute('data-sh-endpoint')) return s.getAttribute('data-sh-endpoint').replace(/\/+$/, '');
        var m = /[?&]w=([^&]+)/.exec(location.search);
        if (m) return decodeURIComponent(m[1]).replace(/\/+$/, '');
        return '';
    })();

    // A stable-per-browser value. This is ONE HALF of the ban key (the IP is the
    // other), so it is not a security boundary - it is a second handle for the
    // same visitor. It is hashed so the raw signals never leave the page.
    function fingerprint() {
        var bits = [];
        try { bits.push(navigator.userAgent); } catch (e) {}
        try { bits.push(navigator.language); } catch (e) {}
        try { bits.push(String(screen.width) + 'x' + String(screen.height) + 'x' + String(screen.colorDepth)); } catch (e) {}
        try { bits.push(String(new Date().getTimezoneOffset())); } catch (e) {}
        try { bits.push(String(navigator.hardwareConcurrency || 0)); } catch (e) {}
        try { bits.push(String(navigator.maxTouchPoints || 0)); } catch (e) {}
        try {
            var c = document.createElement('canvas');
            var g = c.getContext('2d');
            if (g) {
                g.textBaseline = 'top'; g.font = '14px Arial';
                g.fillStyle = '#f60'; g.fillRect(0, 0, 8, 8);
                g.fillStyle = '#069'; g.fillText('scripterhub', 2, 2);
                bits.push(c.toDataURL().slice(-64));
            }
        } catch (e) {}
        var s = bits.join('|');
        var h1 = 0x811c9dc5, h2 = 0x01000193;
        for (var i = 0; i < s.length; i++) {
            h1 = (h1 ^ s.charCodeAt(i)) >>> 0; h1 = (h1 * 16777619) >>> 0;
            h2 = (h2 + s.charCodeAt(i) * (i + 7)) >>> 0; h2 = (h2 * 2654435761) >>> 0;
        }
        return 'fp' + h1.toString(36) + h2.toString(36);
    }

    var FP = fingerprint();
    var QSP = new URLSearchParams(location.search);
    var rid = QSP.get('rid') || '';
    // The provider sends the visitor BACK here with its click id once the ad is
    // done. See the static postback in the worker: Linkvertise's direct link is
    // a fixed string typed into a dashboard, so the callback URL cannot carry a
    // per-session token - it carries the reward and the checkpoint, and the
    // click id comes back on the redirect.
    //
    // It is consumed once and then scrubbed from the address bar, because a
    // second load of the same URL must not try to spend the same click again.
    var RESUME = QSP.get('resume') || '';
    if (RESUME) {
        try {
            var u = new URL(location.href);
            u.searchParams.delete('resume');
            history.replaceState(null, '', u.toString());
        } catch (e) { /* older browsers keep the parameter; it is single use anyway */ }
    }

    function api(path, opts) {
        if (!W) return Promise.resolve({ ok: false, error: 'This page is not connected to the reward server.' });
        var o = opts || {};
        var url = W + path;
        var init = { method: o.method || 'GET', headers: {} };
        if (o.body) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(o.body); }
        return fetch(url, init).then(function (r) {
            return r.json().catch(function () { return { ok: false, error: 'Server replied in a way this page could not read (' + r.status + ').' }; });
        }).catch(function () {
            return { ok: false, error: 'Could not reach the reward server. Check your connection and try again.' };
        });
    }

    // ----------------------------------------------------------------- utils --
    var app = document.getElementById('app');
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function notify(msg) {
        var n = document.getElementById('notif');
        n.textContent = msg; n.classList.add('show');
        setTimeout(function () { n.classList.remove('show'); }, 3500);
    }
    function fmtLeft(ms) {
        if (ms <= 0) return 'Expired';
        var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
        if (h >= 24) return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
        return h + 'h ' + m + 'm';
    }

    // ------------------------------------------------------------------ state --
    var cfg = null;      // public reward config from the worker
    var state = null;    // progress + earned keys from the worker
    var step = null;     // the checkpoint we were last given

    function fatal(msg, detail) {
        app.innerHTML = '<div class="card center"><div class="big">⚠️</div>'
            + '<h1 style="margin-top:12px; font-size:19px;">' + esc(msg) + '</h1>'
            + (detail ? '<p class="sub">' + esc(detail) + '</p>' : '')
            + '</div>';
    }

    function render() {
        if (!cfg || !state) return;
        var total = cfg.total || 0;
        var done = state.done || 0;
        var complete = total > 0 && done >= total;
        var keys = state.keys || [];
        var maxed = keys.length >= (cfg.maxKeys || 1);
        var cooldownUntil = state.cooldownUntil || 0;
        var inCooldown = cooldownUntil > Date.now();
        var canClaim = complete && !maxed && !inCooldown;

        var html = '';

        // ---- progress card ----
        html += '<div class="card">';
        html += '<h1>🎁 ' + esc(cfg.name) + '</h1>';
        html += '<p class="sub">Complete all ' + total + ' checkpoint' + (total === 1 ? '' : 's')
            + ' to earn a ' + (cfg.keyDurationH || 1) + ' hour key.</p>';
        html += '<div class="progress-row">';
        html += '<div class="progress-bar"><div class="progress-fill" style="width:' + (total ? done / total * 100 : 0) + '%"></div></div>';
        html += '<span class="progress-label">Progress: ' + done + '/' + total + '</span>';
        html += '</div>';

        if (total === 0) {
            // The old build fell through to `|| 'about:blank'` here, which is
            // exactly what "the Start button just leads me to about:blank" was.
            // A reward with no checkpoints can never be completed, so it says
            // so instead of offering a button that goes nowhere.
            html += '<div class="warn">This reward has no checkpoints yet, so there is nothing to complete '
                + 'and no key can be earned from it. The owner needs to add a checkpoint in the Rewards tab.</div>';
        } else if (complete) {
            html += '<div class="warn" style="background:rgba(0,204,68,0.1);border-color:rgba(0,204,68,0.3);color:#66ff66">'
                + '✅ All checkpoints complete. Claim your key below.</div>';
        } else {
            // The Start button. It was missing from the first version of this
            // page, which rendered the progress bar and nothing to act on it -
            // caught by tools/reward_flow_test.mjs, which asserts a button
            // exists before clicking it.
            html += '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">'
                + '<button class="btn btn-primary btn-start" id="startBtn">'
                + (step && step.i === 0 ? 'Start' : (done > 0 ? 'Next Checkpoint' : 'Start'))
                + '</button>'
                // Verify is separate from Start on purpose. Start opens the ad;
                // Verify is what comes back afterwards and asks the worker
                // whether it counts. Folding them into one button is what let
                // the old flow complete a checkpoint on a timer.
                + (step ? '<button class="btn btn-primary btn-start" id="verifyBtn">✅ I Have Finished This One</button>' : '')
                + '</div>';
            if (step) {
                html += '<div class="warn" style="background:rgba(108,59,255,0.1);border-color:rgba(108,59,255,0.3);color:#a78bff">'
                    + 'Next up: <strong>' + esc(step.name) + '</strong> (' + esc(step.provider) + ')'
                    + (step.ready ? '. Click Start, complete the ad, then come back and press Verify.'
                        : '. This checkpoint cannot be verified yet - the owner has not finished setting up ' + esc(step.provider) + '.')
                    + '</div>';
                if (!step.ready) {
                    html += '<div class="warn">The owner still needs to finish configuring this provider. '
                        + 'Completing it is not possible until they do, and pretending otherwise would pay out for an ad that never ran.</div>';
                }
            }
        }
        if (inCooldown && complete) {
            html += '<div class="cooldown-note">❄️ Cooldown - you can complete this reward again in ' + fmtLeft(cooldownUntil - Date.now()) + '</div>';
        }
        html += '</div>';

        // ---- checkpoint list ----
        if (total > 0) {
            html += '<div class="card"><h2>🛤️ Checkpoints</h2><div class="steps">';
            (cfg.steps || []).forEach(function (s, i) {
                var cls = (state.doneList && state.doneList.indexOf(i) !== -1) ? 'step done'
                    : (step && step.i === i ? 'step now' : 'step');
                var mark = (state.doneList && state.doneList.indexOf(i) !== -1) ? '✓' : String(i + 1);
                html += '<div class="' + cls + '"><span class="n">' + mark + '</span>'
                    + '<span>' + esc(s.name) + ' <span style="opacity:.6">· ' + esc(s.provider) + '</span></span></div>';
            });
            html += '</div></div>';
        }

        // ---- keys ----
        html += '<div class="card"><h2>🔑 Your Keys (' + keys.length + '/' + (cfg.maxKeys || 1) + ')</h2>';
        if (!keys.length) {
            html += '<p class="sub" style="margin-top:10px">No keys yet - complete all checkpoints, then press the button below.</p>';
        } else {
            html += '<table><tr><th>Key</th><th>Time Left</th><th>Status</th></tr>';
            keys.forEach(function (k) {
                var expired = k.expires <= Date.now();
                html += '<tr><td class="keymono">' + esc(k.key)
                    // THE COPY BUTTON. One click, and the key is on the
                    // clipboard. The key itself is in a data attribute rather
                    // than in the click handler, so nothing user-supplied is
                    // ever interpolated into code.
                    + ' <button type="button" class="keycopy' + (shCopiedKey === k.key ? ' copied' : '') + '" data-k="' + esc(k.key) + '" title="Copy this key">'
                    + (shCopiedKey === k.key ? '✅' : '📋') + '</button></td>'
                    + '<td>' + fmtLeft(k.expires - Date.now()) + '</td>'
                    + '<td class="' + (expired ? 'status-expired' : 'status-active') + '">'
                    + (expired ? 'expired' : 'active') + '</td></tr>';
            });
            html += '</table>';
        }
        html += '<button class="btn btn-key" id="claimBtn" ' + (canClaim ? '' : 'disabled') + '>🔑 Get A New Key</button>';
        if (total > 0 && !complete) html += '<p class="sub" style="text-align:center;margin-top:8px">Complete all checkpoints first.</p>';
        if (maxed) html += '<p class="sub" style="text-align:center;margin-top:8px">You\'ve reached the key limit (' + (cfg.maxKeys || 1) + ').</p>';
        html += '</div>';

        app.innerHTML = html;
        wire();
    }

    function wire() {
        var startBtn = document.getElementById('startBtn');
        if (startBtn) startBtn.onclick = onStart;
        var verifyBtn = document.getElementById('verifyBtn');
        if (verifyBtn) verifyBtn.onclick = onVerify;
        var claimBtn = document.getElementById('claimBtn');
        if (claimBtn) claimBtn.onclick = onClaim;
        // The copy buttons on the keys.
        var copies = document.querySelectorAll('.keycopy');
        for (var i = 0; i < copies.length; i++) {
            copies[i].onclick = function () { shCopyKey(this.getAttribute('data-k'), this); };
        }
    }

    // COPY A KEY.
    //
    // The clipboard API is the happy path, but it is refused in more places
    // than people expect: an insecure origin, a permission that was never
    // granted, an old browser. So there is a fallback, and if even that fails
    // the key is SELECTED, because "the text is selected, press Ctrl+C" is
    // still the right answer and a silent failure is not.
    //
    // The confirmation lives in a variable rather than in the button, because
    // the page re-renders every four seconds to poll for progress, and a
    // confirmation that is wiped by the next poll is not a confirmation.
    var shCopiedKey = '';
    var shCopiedTimer = null;
    function shCopyKey(text, btn) {
        if (!text) return;
        function done(ok) {
            shCopiedKey = ok ? text : '';
            if (shCopiedTimer) clearTimeout(shCopiedTimer);
            shCopiedTimer = setTimeout(function () { shCopiedKey = ''; }, 1600);
            render();
        }
        function fallback() {
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.top = '-1000px';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                var ok = document.execCommand('copy');
                ta.remove();
                if (ok) { done(true); return; }
            } catch (e) { /* fall through to the selection */ }
            var cell = btn && btn.parentNode;
            if (cell && window.getSelection && document.createRange) {
                try {
                    var range = document.createRange();
                    range.selectNodeContents(cell);
                    var sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                } catch (e2) { /* nothing more to try */ }
            }
            done(false);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
        } else {
            fallback();
        }
    }

    function setAction(label, disabled) {
        var b = document.getElementById('startBtn');
        if (!b) return;
        b.textContent = label;
        b.disabled = !!disabled;
    }

    // Open the ad link. A popup rather than a navigation, so this page keeps
    // the visitor's place and the progress bar does not have to survive a
    // round trip through an advertiser's domain.
    //
    // THE WINDOW IS OPENED SYNCHRONOUSLY, BEFORE THE FETCH.
    //
    // It used to be opened inside the .then(), which is outside the user-gesture
    // stack in every modern browser: window.open returns null, and the fallback
    // `location.href = step.target` DESTROYED this page on every checkpoint.
    // The visitor lands on the advertiser, then has to navigate back and
    // re-run boot() to find a Verify button that is still working - which is
    // reported as the checkpoint not counting.
    //
    // A same-tab placeholder is opened first, because browsers will only honour
    // a real popup opened during the click. Its location is replaced once the
    // worker answers.
    function onStart() {
        var target = step && step.target;
        var w = null;
        if (target) {
            // NO 'noopener' IN THE FEATURES STRING.
            //
            // window.open returns null whenever noopener is requested - that is
            // the spec, not a browser quirk. So the placeholder returned null,
            // the `if (w)` branch that points it at the ad never ran, and the
            // fallback window.open() happened outside the user gesture and was
            // blocked. Result: a tab stuck on about:blank, forever.
            //
            // The opener is nulled immediately instead, which gives the same
            // protection without losing the handle.
            w = window.open('about:blank', '_blank');
            try { w.opener = null; } catch (e) { /* cross-origin */ }
        }
        setAction('Opening...', true);
        api('/sh/reward/start', { method: 'POST', body: { rid: rid, fp: FP } }).then(function (r) {
            if (!r.ok) {
                if (w) w.close();
                return handleErr(r);
            }
            step = r.step;
            if (r.complete) {
                if (w) w.close();
                refresh(); setAction('Done', true); return;
            }
            if (!step || !step.target) {
                if (w) w.close();
                setAction('Start', false); return;
            }
            if (w) { try { w.location = step.target; } catch (e) { /* cross-origin, ignore */ } }
            else { window.open(step.target, '_blank', 'noopener'); }
            render();
        }).catch(function () {
            if (w) w.close();
            setAction('Start', false);
        });
    }

    // Come back from the ad and let the worker decide whether it counts.
    //
    // THIS NOW RUNS FOR EVERY PROVIDER, not just `test`.
    //
    // It used to be:
    //
    //     if (step && step.provider === 'test' && step.verifyUrl) { navigate }
    //     refresh();
    //
    // so for linkvertise, workink and lootlabs the button did nothing except
    // re-read unchanged state. The only code path that records a completion is
    // /sh/cp/<provider>, and nothing ever navigated there - a visitor could
    // watch every ad, press the button every time, and stay at 0/N forever.
    // That is reported as "checkpoints would not count as passed", and it was
    // not a configuration mistake: the flow was unrunnable by construction.
    //
    // The worker decides whether the return counts. It holds the signed,
    // single-use, per-step token and the server-side elapsed time, so this
    // client cannot vouch for itself. Navigating away is deliberate - /sh/cp/
    // answers with a verdict PAGE, so the visitor lands somewhere that tells
    // them what happened.
    function onVerify() {
        setAction('Verifying...', true);
        if (step && step.verifyUrl) {
            var sep = step.verifyUrl.indexOf('?') > -1 ? '&' : '?';
            location.href = step.verifyUrl + sep + 'confirmed=1';
            return;
        }
        refresh();
    }

    function onClaim() {
        var b = document.getElementById('claimBtn');
        if (b) b.disabled = true;
        api('/sh/reward/claim', { method: 'POST', body: { rid: rid, fp: FP } }).then(function (r) {
            if (!r.ok) { return handleErr(r); }
            notify('Key Created Successfully');
            refresh();
        });
    }

    function handleErr(r) {
        if (r.error === 'blacklisted') return showBan(r);
        if (r.error === 'cooldown') { notify('Cooldown active - try again later.'); return refresh(); }
        notify(r.error || 'Something went wrong.');
        refresh();
    }

    // A full-screen overlay, not a card in the normal flow.
    //
    // A banned visitor must not be able to scroll past it. The previous version
    // rendered into the app container, ABOVE the progress and key sections, so a
    // long page still showed earned progress and keys underneath the ban - which
    // reads as "banned, but here is everything anyway".
    function showBan(r) {
        stopPolling();
        var until = (r.until || 0);
        var old = document.getElementById('shBanOverlay');
        if (old) old.remove();
        var ov = document.createElement('div');
        ov.id = 'shBanOverlay';
        ov.setAttribute('role', 'alertdialog');
        ov.setAttribute('aria-modal', 'true');
        ov.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0a0a0f;'
            + 'display:flex;align-items:center;justify-content:center;padding:24px;';
        ov.innerHTML =
            '<div style="background:#171a2e;border:1px solid #2a2f4d;border-radius:10px;"'
            + 'padding:44px 52px;max-width:560px;width:100%;text-align:center;"'
            + 'box-shadow:0 24px 70px rgba(0,0,0,.6)">'
            + '<div style="width:74px;height:74px;margin:0 auto 26px;border-radius:50%;"'
            + 'border:3px solid #ff4d5e;display:flex;align-items:center;justify-content:center">'
            + '<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ff4d5e" '
            + 'stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/>'
            + '<line x1="19" y1="5" x2="5" y2="19"/></svg></div>'
            + '<h1 style="font-family:Georgia,serif;font-size:30px;font-weight:700;"'
            + 'color:#fff;margin:0 0 18px">Temporarily Blacklisted</h1>'
            + '<p style="color:#c9cee0;font-size:15px;font-weight:600;line-height:1.6;margin:0 0 18px">'
            + 'Your session for this reward has been temporarily paused due to '
            + esc(shBanReason(r)) + '.</p>'
            + '<p style="color:#8f97b3;font-size:14px;margin:0 0 14px">Do not bypass the ad steps.</p>'
            + '<p style="color:#8f97b3;font-size:14px;margin:0" id="shBanCountdown">'
            + 'You can continue in: ' + shBanLeft(until - Date.now()) + '.</p>'
            + '</div>';
        document.body.appendChild(ov);
        shStartCountdown(until);
    }

    // The stored reason is an internal enum (too-fast, replayed, no-click-id).
    // Surfacing it verbatim tells a bypasser exactly which check tripped and how
    // to avoid the next one, so every code maps to the same plain sentence.
    // fmtLeft is terse ("2h 0m") because it is used inline in dense tables.
    // The ban screen is a single sentence the visitor reads once, so it gets
    // the spelled-out form instead.
    function shBanLeft(ms) {
        if (ms <= 0) return '0 minutes';
        var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
        if (h >= 24) return Math.floor(h / 24) + ' days ' + (h % 24) + ' hours';
        if (h > 0) return h + ' hours ' + m + ' minutes';
        return m + ' minutes';
    }

    function shBanReason(r) {
        return 'bypassing the ad steps';
    }

    // Counts down in place. A static "2 hours" on a page that can stay open for
    // an hour is a small lie, and this is the only part of the screen that moves.
    function shStartCountdown(until) {
        var el = document.getElementById('shBanCountdown');
        if (!el) return;
        var t = setInterval(function () {
            if (!document.body.contains(el)) { clearInterval(t); return; }
            var left = until - Date.now();
            if (left <= 0) { clearInterval(t); location.reload(); return; }
            el.textContent = 'You can continue in: ' + shBanLeft(left) + '.';
        }, 1000);
    }

    function refresh() {
        return api('/sh/reward/state?rid=' + encodeURIComponent(rid) + '&fp=' + encodeURIComponent(FP))
            .then(function (r) {
                if (!r.ok) { return handleErr(r); }
                state = r;
                // Rebuild the current step view from the worker's answer.
                if (r.complete) { step = null; }
                // Disarm the moment the worker says the reward is finished, not
                // on the NEXT tick. Checking only inside the interval callback left
                // the page polling for one more cycle after completion, so a tab
                // left open overnight kept asking about a reward it already had.
                if (r.complete) { stopPolling(); }
                render();
            });
    }

    // Progress used to be re-read only on load, Start and Claim. Completing a
    // checkpoint happens on the WORKER, after the provider callback, so the page
    // that sent the visitor away is showing stale state when they come back -
    // the checkpoint had been recorded and the UI said otherwise.
    //
    // Polling closes that gap. It stops as soon as the reward is complete or the
    // visitor is banned, because neither changes again without their action, and
    // a page left open should not keep asking.
    var pollTimer = null;
    function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(function () {
            if (!cfg || !state) return;
            if (state.complete) { stopPolling(); return; }
            refresh();
        }, 4000);
    }
    function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    // Hand the provider's click back to the worker against OUR session.
    //
    // The worker needs all three: rid and fp to find the session, and the click
    // id to prove the ad ran. It decides everything - this only supplies
    // identifiers. The click id is single use on the server, so a reload with the
    // same URL cannot spend it twice.
    function submitResume() {
        setAction('Checking your ad...', true);
        // The session id is derived server-side from rid+fp+ip, so the page does
        // not have to have kept one. Asking for state first gives us the sid the
        // worker considers ours.
        api('/sh/reward/state?rid=' + encodeURIComponent(rid) + '&fp=' + encodeURIComponent(FP))
            .then(function (s) {
                return api('/sh/reward/complete', {
                    method: 'POST',
                    body: { rid: rid, sid: (s && s.sid) || '', fp: FP, clickId: RESUME }
                });
            })
            .then(function (res) {
                if (res && res.ok) {
                    notify('Checkpoint counted');
                    refresh().then(function () {
                        if (state && state.complete) stopPolling();
                        else if (state && !state.complete) {
                            api('/sh/reward/start', { method: 'POST', body: { rid: rid, fp: FP } }).then(function (n) {
                                if (n.ok && n.step) step = n.step;
                                render();
                            });
                        }
                    });
                    return;
                }
                if (res && res.error === 'blacklisted') { showBan(res); return; }
                // NO SESSION. The worker could not find this browser's session -
                // it expired, or the reward was re-published. Re-opening it
                // here is what stops the visitor being left with a button that
                // can only ever say "no".
                if (res && res.error === 'no session') {
                    notify('Your session had expired - starting a new one.');
                    api('/sh/reward/start', { method: 'POST', body: { rid: rid, fp: FP } }).then(function (n) {
                        if (n.ok && n.step) { step = n.step; setAction('I Have Finished This One', false); }
                        refresh().then(render);
                    });
                    return;
                }
                notify(res && res.error ? String(res.error) : 'That checkpoint was not counted.');
                setAction('I Have Finished This One', false);
                refresh();
            });
    }

    function boot() {
        if (!rid) {
            fatal('This reward link is incomplete',
                'It does not contain a reward id. Ask the owner for the current link - links made before this page was updated no longer work.');
            return;
        }
        api('/sh/reward/pub?rid=' + encodeURIComponent(rid) + '&fp=' + encodeURIComponent(FP)).then(function (r) {
            if (!r.ok) { fatal(r.error || 'This reward link is not valid.'); return; }
            if (r.blacklisted) { showBan(r); return; }
            cfg = r.public;
            if (!cfg.total) {
                // Still render, so the owner (testing their own link) sees WHY.
                state = { done: 0, keys: [], doneList: [] };
                render();
                return;
            }
            // THE VISITOR CAME BACK FROM THE PROVIDER WITH A CLICK ID.
            //
            // This is the moment the checkpoint actually counts, and it is
            // submitted BEFORE anything else so a genuine click is never lost to
            // a slow or failing poll.
            if (RESUME) {
                submitResume();
                return;
            }
            refresh().then(function () {
                if (state && !state.complete) startPolling();
                if (state && !state.complete) {
                    api('/sh/reward/start', { method: 'POST', body: { rid: rid, fp: FP } }).then(function (s) {
                        if (s.ok && s.step) step = s.step;
                        render();
                    });
                }
            });
        });
    }

    boot();
})();
</script>
</body>
</html>
