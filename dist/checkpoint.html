<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Checkpoint</title>
    <!--
        RETIRED - this page used to be a second, entirely client-side
        verification flow.

        It counted down a few seconds in the visitor's own browser, offered a
        "Verify Checkpoint" button, and wrote the anti-bypass blacklist to
        localStorage. Every part of that was under the visitor's control: they
        could skip the timer, and clearing site data cleared the ban.

        Nothing links here any more. Verification now happens on the worker, at
        /sh/cp/<provider>, which the ad provider redirects to and which then
        checks the click with that provider's API. This file is a redirect so
        that an old bookmark lands somewhere sensible instead of on a page that
        pretends to verify something it cannot.

        Kept rather than deleted because a stale bookmark to a 404 tells an
        owner nothing, while a redirect tells them the flow moved.
    -->
    <meta http-equiv="refresh" content="0; url=reward.html">
    <script>
        // Honour an old ?r=... link by carrying the reward id across, if the
        // visitor happens to still hold one. A base64 config is not accepted -
        // it was never signed, so it cannot be trusted.
        (function () {
            try {
                var q = new URLSearchParams(location.search);
                var rid = q.get('rid');
                if (rid) location.replace('reward.html?rid=' + encodeURIComponent(rid));
                else location.replace('reward.html');
            } catch (e) { location.replace('reward.html'); }
        })();
    </script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #8888aa;
               min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; font-size: 14px; }
        a { color: #66ccff; }
    </style>
</head>
<body>
    <p>This page moved. <a href="reward.html">Open the reward page</a>.</p>
</body>
</html>
