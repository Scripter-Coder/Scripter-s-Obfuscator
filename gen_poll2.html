<!DOCTYPE html><html><head><meta charset="utf-8"><title>gen_poll2</title></head><body><pre id="out"></pre>
<script src="https://cdn.jsdelivr.net/npm/luaparse@0.3.1/luaparse.min.js"></script>
<script type="module">
import { vmBCSetLuaparse, applyBytecodeVm } from './vm-bytecode.js';
const luaparse = window.luaparse;
vmBCSetLuaparse(luaparse);
let src='RESULT="ok"';
let vm=applyBytecodeVm(src,{profile:'BALANCED', seedOverride:0});
let lines = vm.split("\n");
document.getElementById('out').textContent = lines.slice(40,100).map((l,i)=> (41+i)+": "+l).join("\n");
console.log(lines.slice(40,100).join("\n"));
</script></body></html>
