<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raw Script</title>
    <style>
        body {
            background: #0a0a0f;
            color: #ff4444;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
        }
        .container {
            padding: 40px;
            border: 2px solid rgba(255, 68, 68, 0.3);
            border-radius: 16px;
            background: rgba(255, 68, 68, 0.05);
        }
        .sub {
            font-size: 14px;
            color: #555577;
            font-weight: 400;
            margin-top: 12px;
        }
        .id-display {
            font-size: 12px;
            color: #333355;
            margin-top: 20px;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container">
        ⛔ Not Allowed
        <div class="sub">This raw endpoint is protected. Unauthorized access is prohibited.</div>
        <div class="id-display" id="scriptIdDisplay"></div>
    </div>
    <script>
        (function() {
            // ============ RAW SCRIPT ACCESS CONTROL ============
            var params = new URLSearchParams(window.location.search);
            var scriptId = params.get('id');
            var loaderKey = params.get('loaderKey');
            var ownerKey = params.get('key');
            var format = params.get('format');

            const OWNER_KEY = 'my_super_secret_key_2024_scripter';

            // Show script ID for debugging
            if (scriptId) {
                document.getElementById('scriptIdDisplay').textContent = 'Script ID: ' + scriptId;
            }

            function loadScripts() {
                try {
                    var data = localStorage.getItem('scriptStore');
                    if (data) return JSON.parse(data);
                } catch (e) {}
                return {};
            }

            function loadProjectScripts() {
                try {
                    var currentUserId = null;
                    try {
                        var sessionUser = sessionStorage.getItem('session_user');
                        if (sessionUser) {
                            var user = JSON.parse(sessionUser);
                            currentUserId = user.id;
                        } else {
                            var localUser = localStorage.getItem('currentUser');
                            if (localUser) {
                                var user = JSON.parse(localUser);
                                currentUserId = user.id;
                            }
                        }
                    } catch (e) {}
                    
                    var projectsData = localStorage.getItem('projects_' + (currentUserId || ''));
                    if (projectsData) {
                        var projects = JSON.parse(projectsData);
                        for (var i = 0; i < projects.length; i++) {
                            if (projects[i].scripts) {
                                for (var j = 0; j < projects[i].scripts.length; j++) {
                                    var s = projects[i].scripts[j];
                                    if (s.loaderId === scriptId || s.id === scriptId) {
                                        return s;
                                    }
                                }
                            }
                        }
                    }
                } catch (e) {}
                return null;
            }

            var scriptStore = loadScripts();
            var scriptCode = scriptStore[scriptId];
            var scriptObj = null;
            
            if (!scriptCode) {
                scriptObj = loadProjectScripts();
                if (scriptObj) {
                    scriptCode = scriptObj.code;
                }
            }

            if (!scriptCode) {
                try {
                    var loaderStore = JSON.parse(localStorage.getItem('loaderStore') || '{}');
                    if (loaderStore[scriptId] && loaderStore[scriptId].code) {
                        scriptCode = loaderStore[scriptId].code;
                    }
                } catch (e) {}
            }

            var isOwner = (ownerKey === OWNER_KEY);
            var isValidLoader = false;

            if (loaderKey && scriptCode) {
                var storedLoaderKey = null;
                if (scriptObj && scriptObj.loaderKey) {
                    storedLoaderKey = scriptObj.loaderKey;
                }
                if (!storedLoaderKey) {
                    try {
                        var loaderStore = JSON.parse(localStorage.getItem('loaderStore') || '{}');
                        if (loaderStore[scriptId] && loaderStore[scriptId].loaderKey) {
                            storedLoaderKey = loaderStore[scriptId].loaderKey;
                        }
                    } catch (e) {}
                }
                if (storedLoaderKey && storedLoaderKey === loaderKey) {
                    isValidLoader = true;
                }
            }

            var hasAccess = isOwner || isValidLoader;

            // ============ DETECT ROBLOX EXECUTOR ============
            var isRoblox = false;
            var ua = navigator.userAgent || '';
            if (ua.includes('Roblox') || ua.includes('RBX') || ua.includes('Synapse') || 
                ua.includes('Krnl') || ua.includes('ScriptWare') || ua.includes('Fluxus') ||
                ua.includes('Electron') || ua.includes('Oxygen U') || ua.includes('Valyse') ||
                ua.includes('Vega') || ua.includes('Calamari') || ua.includes('Xeno') ||
                ua.includes('Sirius') || ua.includes('RPM')) {
                isRoblox = true;
            }

            // Also check if the request is from a Roblox executor via a custom header
            // (Some executors send a special header)
            try {
                var reqHeader = navigator.userAgent.toLowerCase();
                if (reqHeader.includes('roblox') || reqHeader.includes('rbx')) {
                    isRoblox = true;
                }
            } catch (e) {}

            // ============ IF ROBLOX EXECUTOR AND HAS ACCESS -> RETURN CODE ============
            if ((isRoblox || format === 'text') && hasAccess && scriptCode) {
                // For Roblox executors, output just the code (no HTML)
                document.write(scriptCode);
                document.close();
                return;
            }

            // ============ IF OWNER WITH MASTER KEY -> SHOW CODE (for debugging) ============
            if (isOwner && scriptCode && format === 'debug') {
                var escCode = scriptCode.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head><title>Raw Script (Owner Debug)</title>
                    <style>
                        body{background:#0a0a0f;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;margin:0;padding:20px;min-height:100vh;box-sizing:border-box;}
                        .wrap{max-width:1000px;margin:0 auto;}
                        .notice{background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.2);padding:12px;margin-bottom:16px;border-radius:10px;color:#ffd700;font-size:14px;}
                        h1{font-size:20px;margin:0 0 14px 0;color:#66ccff;}
                        .btns{display:flex;gap:10px;margin-bottom:14px;}
                        .btns button{flex:1;padding:10px 16px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,#6c3bff,#00bfff);transition:opacity .2s;}
                        .btns button:hover{opacity:0.85;}
                        .codebox{width:100%;height:65vh;box-sizing:border-box;background:rgba(10,10,20,0.8);color:#66ccff;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:14px;font-family:Consolas,Courier New,monospace;font-size:12px;line-height:1.5;white-space:pre;overflow:auto;resize:vertical;}
                    </style>
                    </head>
                    <body>
                        <div class="wrap">
                            <div class="notice">🔑 Owner Debug Mode - Code visible</div>
                            <h1>📜 Script Code</h1>
                            <div class="btns"><button onclick="copyCode()">📋 Copy Code</button><button onclick="downloadCode()">⬇️ Download Code</button></div>
                            <textarea id="codeField" class="codebox" readonly spellcheck="false">${escCode}</textarea>
                        </div>
                        <script>
                        var CODE = document.getElementById("codeField").value;
                        function copyCode() {
                            var t = document.getElementById("codeField");
                            t.select(); t.setSelectionRange(0, 999999999);
                            if (navigator.clipboard && navigator.clipboard.writeText) {
                                navigator.clipboard.writeText(CODE).then(function(){ alert("Copied to clipboard!"); }, function(){ document.execCommand("copy"); alert("Copied to clipboard!"); });
                            } else { document.execCommand("copy"); alert("Copied to clipboard!"); }
                        }
                        function downloadCode() {
                            var b = new Blob([CODE], { type: "text/plain" });
                            var a = document.createElement("a");
                            a.href = URL.createObjectURL(b);
                            a.download = "script.lua";
                            a.click();
                            setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
                        }
                        <\/script>
                    </body>
                    </html>
                `);
                document.close();
                return;
            }

            // ============ EVERYONE ELSE SEES "NOT ALLOWED" ============
            // record the unauthorized access as a blocked threat (same browser)
            try {
                var threats = JSON.parse(localStorage.getItem('sh_threats_local') || '[]');
                threats.push({ t: Date.now(), reason: 'unauthorized raw access: ' + (scriptId || '?') });
                if (threats.length > 500) threats = threats.slice(-500);
                localStorage.setItem('sh_threats_local', JSON.stringify(threats));
            } catch (e) {}
            console.clear();
        })();
    </script>
</body>
    <script>
    // ============ KEY VERIFICATION ENDPOINT ============
    var params = new URLSearchParams(window.location.search);
    if (params.get('verify-key') === 'true') {
        var key = params.get('key');
        var scriptId = params.get('id');
        
        // Load keys
        var keyData = JSON.parse(localStorage.getItem('keys_' + (currentUserId || '')) || '{"keys":[]}');
        var valid = false;
        for (var i = 0; i < keyData.keys.length; i++) {
            if (keyData.keys[i].key === key && !keyData.keys[i].used) {
                if (!keyData.keys[i].expires || keyData.keys[i].expires > Date.now()) {
                    valid = true;
                    keyData.keys[i].used = true;
                    keyData.keys[i].usedAt = new Date().toISOString();
                    localStorage.setItem('keys_' + (currentUserId || ''), JSON.stringify(keyData));
                    break;
                }
            }
        }
        document.write(valid ? 'valid' : 'invalid');
        document.close();
        return;
    }
</script>
</html>
