<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raw Script</title>
</head>
<body>
    <pre id="content"></pre>
    <script>
        // ============ RAW SCRIPT ACCESS CONTROL ============
        // Only the owner knows this key
        const OWNER_KEY = 'my_super_secret_key_2024_scripter';
        
        // Get script ID from URL
        var params = new URLSearchParams(window.location.search);
        var scriptId = params.get('id');
        var userKey = params.get('key');
        
        // Check if user has owner key
        var isOwner = (userKey === OWNER_KEY);
        
        // Load scripts from localStorage
        function loadScripts() {
            try {
                var data = localStorage.getItem('scriptStore');
                if (data) {
                    return JSON.parse(data);
                }
            } catch (e) {}
            return {};
        }
        
        var scriptStore = loadScripts();
        var scriptCode = scriptStore[scriptId];
        
        // ===== DETECT ROOBLOX EXECUTOR =====
        // Roblox executors send specific headers or user agents
        var isRoblox = false;
        
        // Check User-Agent
        var ua = navigator.userAgent || '';
        if (ua.includes('Roblox') || ua.includes('RBX') || ua.includes('Synapse') || 
            ua.includes('Krnl') || ua.includes('ScriptWare') || ua.includes('Fluxus') ||
            ua.includes('Electron') || ua.includes('Oxygen U') || ua.includes('Valyse')) {
            isRoblox = true;
        }
        
        // Check for Roblox-specific headers (via fetch detection)
        // Note: This is a best-effort detection
        
        // If it's a Roblox executor, return just the script code as plain text
        if (isRoblox && scriptCode) {
            // For Roblox executors, we need to return just the code
            // But since we're in a browser context, we use a trick:
            // We'll use document.write to output just the code
            document.write(scriptCode);
            document.close();
            return;
        }
        
        // If not owner and not Roblox, show "Not Allowed"
        if (!isOwner && !isRoblox) {
            document.getElementById('content').textContent = 'Not Allowed';
            document.body.style.background = '#1a0000';
            document.body.style.color = '#ff4444';
            document.body.style.display = 'flex';
            document.body.style.justifyContent = 'center';
            document.body.style.alignItems = 'center';
            document.body.style.height = '100vh';
            document.body.style.fontFamily = 'monospace';
            document.body.style.fontSize = '24px';
            document.body.style.margin = '0';
            return;
        }
        
        // If owner, show the code with nice UI
        if (isOwner && scriptCode) {
            document.getElementById('content').textContent = scriptCode;
            document.body.style.background = '#0a0a0f';
            document.body.style.color = '#66ccff';
            document.body.style.fontFamily = 'monospace';
            document.body.style.fontSize = '14px';
            document.body.style.padding = '20px';
            document.body.style.margin = '0';
            document.body.style.whiteSpace = 'pre-wrap';
            document.body.style.wordBreak = 'break-all';
        } else if (!scriptCode) {
            document.getElementById('content').textContent = 'Script not found';
            document.body.style.background = '#1a0000';
            document.body.style.color = '#ff4444';
            document.body.style.display = 'flex';
            document.body.style.justifyContent = 'center';
            document.body.style.alignItems = 'center';
            document.body.style.height = '100vh';
            document.body.style.fontFamily = 'monospace';
            document.body.style.fontSize = '24px';
            document.body.style.margin = '0';
        }
    </script>
</body>
</html>
