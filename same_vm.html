<!DOCTYPE html><html><head><meta charset="utf-8"><title>same_vm</title></head><body><pre id="out"></pre>
<script src="https://cdn.jsdelivr.net/npm/luaparse@0.3.1/luaparse.min.js"></script>
<script type="module">
import { vmBCSetLuaparse, applyBytecodeVm } from './vm-bytecode.js';
const luaparse = window.luaparse;
vmBCSetLuaparse(luaparse);
let src='RESULT="ok"';
let vm=applyBytecodeVm(src,{profile:'BALANCED', seedOverride:0});
let lines = vm.split("\n");
let blDef = lines.find(l=>l.includes("local b") && l.includes("={}"));
let decodeLine = lines.find(l=>l.includes("while rp<="));
document.getElementById('out').textContent = "blDef: "+blDef+"\ndecode: "+decodeLine+"\nmatch: "+ (blDef && decodeLine && blDef.includes(decodeLine.match(/#(b\w+)/)?.[1]||"none"));
console.log(blDef, decodeLine);
</script></body></html>
