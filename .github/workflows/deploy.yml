name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Verify the bundle was actually produced - if the build silently
      # produced nothing, the deploy below would ship the OLD bundle and
      # the site would keep running the old obfuscator.
      - name: Verify bundle
        run: |
          set -e
          echo "Built files:"
          ls -la dist/
          ls -la dist/assets/
          test -f dist/index.html
          test -n "$(ls dist/assets/*.js 2>/dev/null)"
          echo "Bundle OK"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4