<!DOCTYPE html><html><head><meta charset="utf-8"><title>src_check</title></head><body><pre id="out"></pre>
<script src="https://cdn.jsdelivr.net/npm/luaparse@0.3.1/luaparse.min.js"></script>
<script type="module">
import { vmBCSetLuaparse, applyBytecodeVm } from './vm-bytecode.js';
const luaparse = window.luaparse;
vmBCSetLuaparse(luaparse);
let src='RESULT="ok"';
let vm=applyBytecodeVm(src,{profile:'BALANCED', seedOverride:0});
let m = vm.match(/local src=\{([^}]+)\}/);
let len = m ? m[1].split(',').filter(s=>s.trim()!=='').length : 0;
let blMatch = vm.match(/local (b\w+)=\{\}/);
let blName = blMatch ? blMatch[1] : 'none';
let src2 = vm.match(/local src=\{[^}]+\}/g);
document.getElementById('out').textContent = "blName "+blName+" src len "+len+" vm len "+vm.length+" first src snippet "+ (m?m[1].slice(0,100):"none");
console.log("bl",blName,"src len",len);
</script></body></html>
