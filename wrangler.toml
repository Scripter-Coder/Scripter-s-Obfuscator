# =============================================================================
# ScripterHub hosted platform — Cloudflare Worker configuration
# =============================================================================
# READ THIS BEFORE YOUR FIRST `wrangler deploy`.
#
# This file did not exist before Phase 0. Bindings were configured by hand in
# the Cloudflare dashboard, which is how they drifted. Everything the worker
# needs is now declared here so the deployment is reproducible and reviewable.
#
# The values marked "CHANGE ME" are placeholders. Two of them MUST be replaced
# before a deploy will do the right thing:
#
#   account_id  -> your Cloudflare account id
#   name        -> the name of the EXISTING deployed worker
#
# Get the worker name from the dashboard (Workers & Pages -> your worker), or
# from the current loadstring base URL. Do NOT guess it: deploying under a new
# name creates a SECOND worker rather than updating yours, and your existing
# loadstrings would keep pointing at the old one.
#
# ============================== FIRST DEPLOY ===============================
# Do these in order. Steps 1-4 change nothing about how the worker serves
# traffic, so they are all safe to run before any code goes live.
#
# 1. install + authenticate (needs your Cloudflare account):
#      npm i -g wrangler
#      wrangler login
#
# 2. create the D1 database:
#      wrangler d1 create scripterhub
#    -> paste the returned database_id into [[d1_databases]] below
#
# 3. apply the schema:
#      wrangler d1 execute scripterhub --file=migrations/0001_init.sql
#
# 4. set the three secrets (see the block below for what each one does):
#      wrangler secret put SH_SETUP_TOKEN"
#      wrangler secret put SH_SESSION_SECRET
#      wrangler secret put SH_KDF_PEPPER
#
# 5. fill in account_id, name, and the KV namespace id, then:
#      wrangler deploy
#
# 6. ONCE, claim the generated owner access code:
#      curl -X POST https://<your-worker-domain>/sh/owner-claim \
#           -H 'Content-Type: application/json' \
#           -d '{"setupToken":"<the SH_SETUP_TOKEN you set in step 4>"}'
#
#    The code comes back ONCE and is deliberately NOT written to the worker
#    logs. Cloudflare retains logs and anyone with dashboard access can read
#    them, so a credential printed to a log is a permanently exposed credential
#    no matter how briefly it was shown. Save the response somewhere safe.
#    Afterwards you can delete that route from worker.js; to rotate the code
#    later, use /sh/setcode.
# ============================================================================
# REQUIRED SECRETS — the worker degrades in SECURITY, not in availability,
# when these are missing, and logs a warning. Set all three before going live.
#
#   wrangler secret put SH_SETUP_TOKEN
#       Bootstrap/admin token for /sh/setcode. Also the fallback signing key
#       if SH_SESSION_SECRET is unset, which is exactly why you should set it.
#
#   wrangler secret put SH_SESSION_SECRET
#       HMAC key for owner and user session tokens (Phase 1). Without it the
#       worker derives a fallback from SH_SETUP_TOKEN, so tokens remain
#       forgeable by anyone who knows that one value. 32+ random bytes:
#         node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#
#   wrangler secret put SH_KDF_PEPPER
#       Server-side pepper mixed into every password hash (Phase 1). Held in
#       the secret store and never in KV, so a stolen database dump alone does
#       not allow offline cracking. 32+ random bytes, same command as above.
#
# TELEMETRY (optional, but you want it):
#   wrangler secret put SH_DISCORD_WEBHOOK
#       Your Discord log webhook. METADATA ONLY — there is no code path that can
#       put source, a license key, a Special Key or artifact bytes into it (the
#       event builder takes a fixed allowlist and refuses anything else; gate
#       G15 pins this).
#
#       This is the variable people report as "the webhook doesn't work". Two
#       reasons it looks broken, both now diagnosable:
#         1. It used to swallow every error (`catch (e) {}`), so a revoked URL,
#            a typo and a 429 all looked identical: silence. As of Phase 3 the
#            worker logs `telemetry webhook returned HTTP <status>` or
#            `telemetry webhook unreachable` to the worker log. Run
#            `wrangler tail` and trigger one event (publish a script) to see
#            which one you have.
#         2. Discord invalidates old webhook URLs on some channels. Re-copy it
#            from Server Settings -> Integrations -> Webhooks.
#       It can equally be set as a plain TEXT variable in the dashboard
#       (Settings -> Variables and Secrets). Text is arguably better here: a
#       Secret is redacted in the UI, which makes a typo invisible.
#
# Optional:
#   wrangler secret put SH_ARTIFACT_KEK      (Phase 4: at-rest encryption)
#   wrangler secret put SH_GH_REPO / SH_GH_TOKEN  (Storage Keeper)
#
# NOTE ON password migration: existing accounts hold legacy btoa() records.
# They are accepted once and transparently re-hashed to PBKDF2 on the next
# successful login, and the rehash REPLACES the record rather than shadowing
# it, so the btoa value is gone the moment it succeeds. Until a user logs in,
# their old record is still recoverable — a hash cannot be computed without
# the plaintext. For accounts that never log in, the clean fallback is a
# forced password reset, which drops the record entirely.
#
# Generate strong values with:
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
# ============================================================================

# =============================================================================
# THREE NAMES THAT LOOK THE SAME AND ARE NOT. GET THIS RIGHT.
# =============================================================================
#
#   1. THE WORKER              -> name = "..."  (this line)
#      This is the deployed script. Your live loadstrings all point at
#      https://scripterhub-stats.dubovikstanislav51.workers.dev/..., so the
#      worker is named "scripterhub-stats".
#      That URL is read from main.js:54 (SH_STATS_ENDPOINT). That is the
#      authority — it is where real customers are pointed today.
#
#   2. THE KV NAMESPACE TITLE  -> shown in the dashboard as "scripterhub-loaders"
#      A label for the namespace. It is NOT a worker name and wrangler does
#      not need it if you give the id below.
#      If you are ever tempted to type it into `name =`, you will deploy a
#      SECOND, EMPTY worker while your customers keep hitting the old one —
#      and nothing will look wrong until you go looking for your scripts.
#      An earlier revision of this file had exactly that bug.
#
#   3. THE BINDING VARIABLE    -> binding = "LOADERS_KV"
#      The name your code uses: env.LOADERS_KV. Unrelated to both above.
#      Changing it would break every `env.LOADERS_KV` reference in worker.js.
#
# After `wrangler login`, confirm the real worker name:
#     wrangler deployments list
# =============================================================================

name = "scripterhub-stats"             # the WORKER, not the KV namespace
main = "For Cloudflare/worker.js"
compatibility_date = "2024-11-01"
account_id = "569dfd1193e2a3561429007982b06acf"              # CHANGE ME

# -----------------------------------------------------------------------------
# STATE
# -----------------------------------------------------------------------------
# KV keeps what it is genuinely good at: large immutable values addressed by
# key. That is exactly the artifact store, and it stays.
#
# D1 is new in Phase 2 and it exists for ONE reason: KV has no atomic
# compare-and-swap and is eventually consistent, so it CANNOT correctly
# implement (a) one-time nonce consumption, (b) rate-limit increments, or
# (c) validate-and-consume in a single step. Those three are the core of
# session-gated delivery. Do not try to build them on KV.
#
# `wrangler deploy --dry-run` lists the binding as present even with no id
# below, so do NOT read a clean dry-run as "KV is fine". Set the real id.
[[kv_namespaces]]
binding = "LOADERS_KV"
# MUST BE UNCOMMENTED. Get it from:
#     wrangler kv namespace list
#   (or dashboard -> Storage & Databases -> KV -> your namespace -> ID)
# then copy the `id` column, which looks like a 32-char hex string. That is
# NOT the title "scripterhub-loaders".
#
# THIS NAMESPACE HOLDS ALL YOUR LIVE DATA: sh_loader_, sh_meta_, sh_licenses,
# sh_users_db, sh_skey_, sh_chunk_*. Point it at the existing namespace. Do
# not create a new one, and do not guess the id — a wrong or empty id either
# fails the deploy or points at an empty store, and in both cases every
# script, license and key you have ever published becomes unreachable.
# id = "PASTE_THE_NAMESPACE_ID_HERE"
# preview_id = "PASTE_THE_PREVIEW_NAMESPACE_ID_OR_COMMENT_OUT"

[[d1_databases]]
binding = "SH_DB"
database_name = "scripterhub"
# wrangler d1 create scripterhub   -> paste the returned database_id
# database_id = "CHANGE_ME"
# migrations_dir = "migrations"

# -----------------------------------------------------------------------------
# OBSERVABILITY — TURN THIS ON
# -----------------------------------------------------------------------------
# Phase 3 turned this on deliberately, and it is the only way to find out why
# the telemetry webhook is not delivering.
#
# Every non-2xx from the webhook now produces a console.error, and console.error
# is invisible without logs. So with this off, "the webhook doesn't work" is
# undiagnosable by construction: the worker knows and tells nobody.
#
#   wrangler tail                 # live, no config change needed
#   dashboard: Observability -> enabled
#
# Cost: worker logs retain metadata (script ids, hashed license refs, IPs,
# User-Agents, reasons). They never contain source, keys or artifacts, because
# the audit_log table and the telemetry allowlist have no column or field that
# could hold one. That is a property of the shape, not of discipline.
[observability]
enabled = true

# -----------------------------------------------------------------------------
# CRON: the janitor
# -----------------------------------------------------------------------------
# Every table the state layer writes grows without bound otherwise. The
# `scheduled` handler sweeps expired sessions, orphaned nonces, stale
# rate-limit windows and old audit rows.
#
# Hourly, because the tables grow from traffic volume rather than from
# anything time-sensitive, and a sweep that runs more often does not delete
# meaningfully more. A daily job would leave a full day of garbage between
# runs, which is exactly the accumulation this exists to stop.
#
# Note this runs on a SCHEDULE, not on a request path: putting a multi-table
# DELETE in front of somebody trying to run a script would be a self-inflicted
# outage. Nothing in a user's run depends on this having happened.
[triggers]
crons = ["17 * * * *"]

# -----------------------------------------------------------------------------
# HARDENING DEFAULTS
# -----------------------------------------------------------------------------
# The whole delivery model assumes the origin is not directly reachable.
[placement]
mode = "smart"

# NOTE ON THESE THREE
#
# They are documentation, not configuration. The session TTLs live in
# DELIVERY RULES in worker.js (SESSION_TTL_MS / URL_SESSION_TTL_MS), next to the code that
# enforces them, and the 60s ceiling is ALSO a database trigger, so it cannot be
# raised from here even if someone edits this file. They are repeated as vars so
# the intended numbers are visible in one place.
#
# Set them ONLY if you know why you are changing them. Raising SH_SESSION_TTL_MS
# to anything large is a direct reduction in security: a session is worth
# exactly one artifact, and the value of a captured one is its remaining life.
[vars]
SH_DELIVERY_REQUIRE_AUTH = "1"        # Phase 3: refuse artifact without session
SH_URL_TOKEN_TTL_SECONDS = "15"       # the weaker HttpGet fallback path
SH_SESSION_TTL_SECONDS = "45"         # primary request() path

# ---- STORAGE KEEPER: where generated script BYTES live ----
# Both of these must be set or the backend is inert. With them unset, storeConfigured()
# is false and every byte falls back to Cloudflare KV - which looks like a working site
# while quietly using the storage this change was meant to free.
#
# The URL is the address tunnel.py printed when you started the service.
# The token is NOT here on purpose: set it with
#     npx wrangler secret put SH_STORE_TOKEN
# so it never lands in git. It must match Storage Keeper/data/token.txt.
#
# A QUICK TUNNEL (cloudflared tunnel --url) gets a RANDOM address that CHANGES ON EVERY
# RESTART. If you set one here, the next reboot makes every script fail at once while
# your PC still looks healthy - update this value at the same time as you restart.
SH_STORE_URL = "https://photographer-cause-prints-consumption.trycloudflare.com"

# Your telemetry webhook. Set this HERE or in the dashboard — the dashboard is
# usually easier, and a Text variable keeps the value visible so a typo is
# obvious. See the SH_DISCORD_WEBHOOK notes near the top of this file for the
# three failure modes and how to tell them apart.
# SH_DISCORD_WEBHOOK = "https://discord.com/api/webhooks/…/…"

# -----------------------------------------------------------------------------
# THE /sh/k COMPATIBILITY WINDOW — READ THIS BEFORE YOUR FIRST DEPLOY
# -----------------------------------------------------------------------------
# Phase 3 changed what /sh/k requires. The obfuscator BAKES the old request
# shape into every published file, and those bytes are already in your users'
# hands. Re-copying the loadstring does NOT fix it: the loadstring is only
# `loadstring(game:HttpGet(".../sh/<id>"))()`, so the new bootstrap IS fetched,
# but the artifact it delivers still contains the old baked-in chunk, which
# then calls /sh/k the old way.
#
#   requireKey ON  :  /sh/k/<id>?t=t0&a=<token>&k=KEY&h=HWID
#   requireKey OFF :  /sh/k/<id>?t=t0
#
# OFF (the default) = every require-key script published before today stops
# working the moment you deploy, worldwide.
#
# ON = they keep working while you migrate, at a real cost:
#
#   still closed : expired licenses (G05), banned licenses (G06), kill switch,
#                  private scripts
#   re-opened    : token replay (G07), token expiry (G08), offline token
#                  forgery by a valid license holder (G09)
#
# So during the window a valid license holder can mint themselves a permanent
# key-fetch credential. They still do not get the source — the artifact is
# assembled at runtime through /sh/session and /sh/a — but it is a genuine
# reduction. Keep it as short as you can.
#
# Every legacy delivery is logged as `legacy.delivery` (audit table AND
# Discord telemetry). Watch it reach zero, then remove this line and redeploy.
# Only "1" or "true" enable it; a typo leaves the secure behaviour in place.
#
# SH_LEGACY_SPLIT_KEY = "1"
